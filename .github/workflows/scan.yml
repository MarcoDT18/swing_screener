name: Daily scan

on:
  schedule:
    # 05:45 UTC, Tue-Sat — after the previous US close is final.
    # (Yesterday's US close + FTSE close are both in by then.)
    - cron: "45 5 * * 2-6"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh ticker lists (best effort)
        run: python screener/refresh_tickers.py || echo "refresh failed, using committed lists"

      - name: Run the scan
        run: python screener/scan.py

      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan.json tickers/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Build dashboard page
        run: python dashboard/build_site.py

      - name: Setup Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
