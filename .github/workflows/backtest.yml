name: Backtest

on:
  schedule:
    # first Saturday-ish of each month, after that morning's scan
    - cron: "30 7 1 * *"
  workflow_dispatch: {}   # run it any time from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the backtest (~5y, all tickers)
        run: python backtest/backtest.py

      - name: Run the Monte Carlo strategy simulation
        run: python backtest/montecarlo.py

      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json data/montecarlo.json
          git diff --cached --quiet || git commit -m "backtest: $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Build site
        run: python dashboard/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
